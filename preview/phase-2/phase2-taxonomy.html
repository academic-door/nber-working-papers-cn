<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>研究分类｜Academic Door NBER 工作论文</title>
  <meta name="description" content="按 NBER 研究项目、JEL 分类和 NBER 研究主题浏览工作论文。">
  <link rel="icon" href="assets/images/academic-door-favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/phase2-taxonomy.css">
</head>
<body class="phase2-taxonomy-page">
  <div role="status" style="padding:9px 16px;background:#152334;color:#fff;font:600 13px/1.4 system-ui,sans-serif;text-align:center;">网站改版第二阶段预览 · 非正式页面</div>
  <header class="taxonomy-hero">
    <p class="taxonomy-eyebrow">学术传送门 · NBER 工作论文</p>
    <h1>研究分类</h1>
    <p class="taxonomy-lead">按 NBER 研究项目、JEL 分类和研究主题浏览工作论文。</p>
  </header>

  <main class="taxonomy-shell">
    <section class="taxonomy-stats" aria-label="分类数据">
      <div><span>论文总数</span><strong id="corpusCount">—</strong><small>篇</small></div>
      <div><span>NBER 研究项目</span><strong id="programCoverage">—</strong><small>论文覆盖率</small></div>
      <div><span>JEL 分类</span><strong id="jelCoverage">—</strong><small>论文覆盖率</small></div>
      <div><span>浏览年份</span><strong><select id="taxonomyYear" aria-label="浏览年份"></select></strong><small>按年份查看</small></div>
    </section>

    <section class="taxonomy-section">
      <div class="taxonomy-heading">
        <div>
          <h2>NBER 研究项目</h2>
        </div>
      </div>
      <div id="programGrid" class="taxonomy-card-grid" aria-live="polite"></div>
    </section>

    <section class="taxonomy-section">
      <div class="taxonomy-heading">
        <div>
          <h2>JEL 分类</h2>
        </div>
      </div>
      <div id="jelGrid" class="taxonomy-card-grid jel-grid" aria-live="polite"></div>
    </section>

    <section class="taxonomy-section taxonomy-reference">
      <div class="taxonomy-heading">
        <div>
          <h2>NBER 研究主题</h2>
        </div>
        <a class="taxonomy-external" href="https://www.nber.org/research/topics" target="_blank" rel="noopener">查看 NBER 主题目录 ↗</a>
      </div>
      <div id="topicsGrid" class="topics-reference-grid"></div>
    </section>

    <section class="taxonomy-section">
      <div class="taxonomy-heading">
        <div>
          <h2>专题研究</h2>
        </div>
      </div>
      <div id="collectionGrid" class="taxonomy-card-grid collection-grid"></div>
    </section>

    <section id="taxonomyResultsSection" class="taxonomy-results" hidden>
      <div class="taxonomy-results-head">
        <div>
          <h2 id="resultTitle">论文</h2>
          <p id="resultMeta"></p>
        </div>
        <button type="button" id="clearTaxonomyFilter">清除筛选</button>
      </div>
      <div id="taxonomyPaperList" class="taxonomy-paper-list"></div>
      <p id="taxonomyMoreNote" class="taxonomy-more-note"></p>
    </section>
  </main>

  <script src="assets/phase2-taxonomy.js"></script>
</body>
</html>
